<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configuração operacional · Bolinha de Gude</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/dashboard/dashboard.css" rel="stylesheet">
  </head>
  <body class="bg-body-tertiary">
    <main class="container py-4 py-lg-5" style="max-width: 860px">
      <header class="d-flex align-items-center justify-content-between gap-3 mb-4">
        <div><div class="eyebrow">PAINEL OPERACIONAL</div><h1 class="h3 mb-1">Configuração operacional</h1><p class="text-secondary mb-0">Alterações valem para as próximas sessões de trading.</p></div>
        <a href="/dashboard" class="btn btn-outline-secondary btn-sm">Voltar ao dashboard</a>
      </header>
      <div id="configuration-alert" class="alert" role="status">Carregando configuração…</div>
      <section class="card border-0 shadow-sm">
        <div class="card-body p-3 p-md-4">
          <div class="d-flex flex-wrap justify-content-between gap-2 border-bottom pb-3 mb-4 small text-secondary">
            <span>Atualizada em: <strong id="updated-at">—</strong></span><span>Sessão: <strong id="session-phase">—</strong></span><span>Loop: <strong id="loop-status">—</strong></span>
          </div>
          <form id="configuration-form">
            <div class="row g-3">
              <div class="col-12"><label class="form-label" for="timezone">Fuso horário</label><input id="timezone" class="form-control" name="timezone" required></div>
              <div class="col-md-6"><label class="form-label" for="startTime">Início</label><input id="startTime" class="form-control" name="startTime" type="time" required></div>
              <div class="col-md-6"><label class="form-label" for="stopNewPositionsTime">Parar novas posições</label><input id="stopNewPositionsTime" class="form-control" name="stopNewPositionsTime" type="time" required></div>
              <div class="col-md-6"><label class="form-label" for="forceCloseTime">Forçar encerramento</label><input id="forceCloseTime" class="form-control" name="forceCloseTime" type="time" required></div>
              <div class="col-md-6"><label class="form-label" for="endTime">Fim</label><input id="endTime" class="form-control" name="endTime" type="time" required></div>
              <div class="col-md-4"><label class="form-label" for="intervalSeconds">Intervalo (segundos)</label><input id="intervalSeconds" class="form-control" name="intervalSeconds" type="number" min="1" step="1" required></div>
              <div class="col-md-4"><label class="form-label" for="initialBankUsdt">Banca inicial (USDT)</label><input id="initialBankUsdt" class="form-control" name="initialBankUsdt" type="number" min="0.00000001" step="0.00000001" required></div>
              <div class="col-md-4"><label class="form-label" for="maxPositionPercent">Máx. por posição (%)</label><input id="maxPositionPercent" class="form-control" name="maxPositionPercent" type="number" min="0.01" max="100" step="0.01" required></div>
            </div>
            <div class="d-flex align-items-center gap-3 mt-4"><button id="save-button" class="btn btn-primary" type="submit">Salvar alterações</button><span id="form-message" class="small" role="status"></span></div>
          </form>
        </div>
      </section>
    </main>
    <script src="/dashboard/configuration.js"></script>
  </body>
</html>
